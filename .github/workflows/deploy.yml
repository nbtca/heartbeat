name: deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build probe image
        run: docker build --tag heartbeat-probe:check --file probe/Dockerfile .
      - name: Validate Compose deployment
        env:
          PROBE_TOKEN: ci-placeholder-not-a-secret
        run: docker compose -f probe/compose.yaml config --quiet
      - name: Smoke test probe container
        run: |
          export PROBE_TOKEN=ci-placeholder-not-a-secret PROBE_IMAGE=heartbeat-probe:check HEARTBEAT_URL=http://127.0.0.1:1
          docker compose -f probe/compose.yaml up -d --no-build --pull never probe
          trap 'docker compose -f probe/compose.yaml down' EXIT
          for attempt in $(seq 1 20); do
            if docker compose -f probe/compose.yaml exec -T probe node -e "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              docker compose -f probe/compose.yaml exec -T probe node -e "fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.status===503?0:1)).catch(()=>process.exit(1))"
              exit $?
            fi
            sleep 1
          done
          docker compose -f probe/compose.yaml logs probe
          exit 1

  worker:
    needs: test
    if: github.ref == 'refs/heads/main' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx wrangler d1 migrations apply heartbeat --remote
      - run: npx wrangler deploy

  probe:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: probe/Dockerfile
          push: true
          tags: |
            ghcr.io/nbtca/heartbeat-probe:latest
            ghcr.io/nbtca/heartbeat-probe:${{ github.sha }}
